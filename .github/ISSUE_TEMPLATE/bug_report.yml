name: Bug report
description: Something in SciConnect doesn't work the way it should.
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: Describe what you saw, and what you expected to see instead.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Go to Research feed
        2. Open a post with a fact check
        3. Click "Add source"
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Research posts
        - Fact checks
        - Collaboration
        - Groups and messages
        - Profiles and connections
        - Sign-in and accounts
        - Setup or deployment
        - Something else
  - type: input
    id: env
    attributes:
      label: Browser and OS
      placeholder: Firefox 131 on macOS 14
  - type: textarea
    id: logs
    attributes:
      label: Logs or screenshots
      description: Paste server output or browser console errors. Remove any secrets first.
      render: shell
